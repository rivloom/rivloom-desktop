[package]
name = "rivloom-desktop"
version = "0.1.4"
edition = "2021"
description = "Rivloom human and AI task collaboration desktop client"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-single-instance = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Notifications"] }
windows-core = "=0.62.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
