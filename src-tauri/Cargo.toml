[package]
name = "rivloom-desktop"
version = "0.1.21"
edition = "2021"
description = "Rivloom human and AI task collaboration desktop client"
publish = false
license = "Apache-2.0"
repository = "https://github.com/rivloom/rivloom-desktop"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-single-instance = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "=2.11.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream"] }
semver = "=1.0.28"
tokio = { version = "=1.53.1", features = ["time", "macros", "sync"] }
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Notifications", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = "=0.62.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
