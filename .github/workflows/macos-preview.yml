name: macOS Apple Silicon preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          architecture: arm64
          package-manager-cache: false
      - name: Require native Apple Silicon
        run: node -e 'require("node:assert/strict").ok(process.platform === "darwin" && process.arch === "arm64")'
      - run: npm ci
      - run: npm run typecheck
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
      - name: Compile the native process and Keychain helpers
        run: |
          node scripts/macos-process-build.ts
          node scripts/macos-keychain-build.ts
      - name: Verify platform contracts and native process ownership
        run: node scripts/macos-tests.ts
      - name: Prepare an isolated CI Keychain
        run: node scripts/macos-keychain-ci.ts setup
      - name: Verify persistent Keychain identity across processes
        run: node scripts/macos-identity-smoke.ts
      - name: Build and verify the source-locked Mac engine
        id: engine-prepare
        run: npm run engine:prepare
      - name: Verify model configuration, restart and clean service exit
        if: ${{ !cancelled() && steps.engine-prepare.outcome == 'success' }}
        run: node scripts/headless-service-check.ts
      - name: Verify two-node pairing and task execution with a local synthetic model
        if: ${{ !cancelled() && steps.engine-prepare.outcome == 'success' }}
        run: node scripts/headless-task-check.ts
      - name: Build the isolated ad-hoc-signed preview application and DMG
        id: preview-build
        run: npm run desktop:build -- --config src-tauri/tauri.macos.conf.json
      - name: Verify native desktop behavior
        if: ${{ !cancelled() && steps.preview-build.outcome == 'success' }}
        run: cargo test --release --locked --bin rivloom-desktop --manifest-path src-tauri/Cargo.toml
      - name: Verify the installed DMG application, bundled hashes and restart
        if: ${{ !cancelled() && steps.preview-build.outcome == 'success' }}
        run: node scripts/macos-package-smoke.ts
      - name: Restore the runner Keychain settings
        if: always()
        run: node scripts/macos-keychain-ci.ts cleanup
      - name: Preserve bounded native verification results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-preview-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/macos/*.json
            test-results/macos/*.png
            test-results/macos/package-service.log
            test-results/headless-service/*/report.json
            test-results/headless-task/*/report.json
            .data/engine-builds/*/source/rivloom/.tools/guard-integration-report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve the verified Mac preview package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rivloom-macos-arm64-preview-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            test-results/macos/package-smoke.json
          if-no-files-found: error
          retention-days: 14
