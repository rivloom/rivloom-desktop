name: Publish verified Linux x64

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Linux headless CI run ID for this exact main commit
        required: true
        type: string
      x64_artifact_id:
        description: Verified linux-x64 artifact ID from that build run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-release-${{ github.sha }}
  cancel-in-progress: false

env:
  RIVLOOM_LINUX_BUILD_RUN_ID: ${{ inputs.build_run_id }}
  RIVLOOM_LINUX_X64_ARTIFACT_ID: ${{ inputs.x64_artifact_id }}

jobs:
  verify:
    if: github.repository == 'rivloom/rivloom-desktop' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify same-source successful main build and exact artifact identity before downloading
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/linux-release.ts verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rivloom-linux-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/linux-provenance/result.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      artifact-id: ${{ steps.report.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.x64_artifact_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: test-results/linux/x64
          digest-mismatch: error
      - name: Recheck provenance and complete native acceptance before immutable Linux publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/linux-release.ts publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: report
        with:
          name: rivloom-linux-publication-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/linux-release/release.json
          if-no-files-found: error
          retention-days: 14

  website-download:
    if: vars.RIVLOOM_PUBLIC_DOWNLOADS_ENABLED == 'true'
    needs: [verify, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    concurrency:
      group: public-rivloom-download
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.x64_artifact_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: test-results/linux/x64
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.publish.outputs.artifact-id }}
          path: test-results/linux-release
          digest-mismatch: error
      - name: Verify full public download then promote only the independent Linux record
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RIVLOOM_R2_ACCOUNT_ID: ${{ vars.RIVLOOM_R2_ACCOUNT_ID }}
          RIVLOOM_R2_BUCKET: ${{ vars.RIVLOOM_R2_BUCKET }}
          RIVLOOM_R2_ACCESS_KEY_ID: ${{ secrets.RIVLOOM_R2_ACCESS_KEY_ID }}
          RIVLOOM_R2_SECRET_ACCESS_KEY: ${{ secrets.RIVLOOM_R2_SECRET_ACCESS_KEY }}
          RIVLOOM_PAGES_DEPLOY_HOOK: ${{ secrets.RIVLOOM_PAGES_DEPLOY_HOOK }}
        run: node scripts/linux-release.ts website
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rivloom-linux-download-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/linux-website/result.json
          if-no-files-found: warn
          retention-days: 14
