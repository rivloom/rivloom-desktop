name: Windows discovery transport regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-discovery-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  transport:
    # Same-host real Windows network stacks. This does not claim two-device acceptance.
    name: Same-host ${{ matrix.lane }} transport (failure remains visible)
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [mdns, udp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          architecture: x64
          package-manager-cache: false
      - run: npm.cmd ci
      - name: Diagnose Windows DPAPI with non-sensitive test data
        run: node scripts/ci-windows-diagnostics.ts
      - name: Run the original transport assertions without a fallback substitution
        env:
          CI_TEST_LANE: ${{ matrix.lane }}
        run: node scripts/ci-tests.ts $env:CI_TEST_LANE
      - name: Preserve the actual pass or fail summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-transport-${{ matrix.lane }}-summary
          path: test-results/ci/*.json
          if-no-files-found: warn
          retention-days: 14
