name: Independent read-only public consumers for 0.1.30

on:
  workflow_dispatch:
    inputs:
      expected_consumer_commit:
        description: Full reviewed SHA of the temporary consumer branch
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: readonly-public-consumer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consumer:
    if: github.repository == 'rivloom/rivloom-desktop' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-readonly-0130-20261008'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout reviewed consumer code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: consumer
          persist-credentials: false
      - name: Checkout immutable published product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4a359ea99380678db66688732fb82672979ff036
          path: product
          persist-credentials: false
          fetch-depth: 0
      - name: Use fixed consumer Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install locked reader dependencies without running package scripts
        if: matrix.platform == 'windows'
        working-directory: product
        run: npm ci --ignore-scripts
      - name: Consume existing candidate and complete public packages
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONSUMER_COMMIT: ${{ inputs.expected_consumer_commit }}
        run: node consumer/scripts/release-readonly/run.mjs ${{ matrix.platform }} "${{ github.workspace }}/product"
      - name: Preserve only small fresh consumer reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rivloom-readonly-consumer-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/readonly-consumer/${{ matrix.platform }}/*.json
          if-no-files-found: error
          retention-days: 90
