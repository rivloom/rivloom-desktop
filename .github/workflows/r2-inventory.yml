name: One-time reviewed R2 retention for 0.1.30

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full reviewed commit of this temporary branch
        required: true
        type: string
      manifest_sha256:
        description: SHA256 of the exact reviewed candidate manifest
        required: true
        type: string
      mode:
        description: Read-only plan or execute exact reviewed candidates
        required: true
        default: plan
        type: choice
        options:
          - plan
          - delete

permissions:
  contents: read
  actions: read

concurrency:
  group: public-rivloom-download
  cancel-in-progress: false

jobs:
  retention:
    if: github.repository == 'rivloom/rivloom-desktop' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/r2-retention-0130-20261008'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exactly the reviewed temporary commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use fixed Node without installing project dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Validate exact commit, manifest and target before exposing R2 credentials
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          RETENTION_MODE: ${{ inputs.mode }}
        run: node scripts/r2-retention-once/execute.mjs validate
      - name: Recheck policy and exact objects inside the publication mutex
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          RETENTION_MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
          RIVLOOM_R2_ACCOUNT_ID: ${{ vars.RIVLOOM_R2_ACCOUNT_ID }}
          RIVLOOM_R2_BUCKET: ${{ vars.RIVLOOM_R2_BUCKET }}
          RIVLOOM_R2_ACCESS_KEY_ID: ${{ secrets.RIVLOOM_R2_ACCESS_KEY_ID }}
          RIVLOOM_R2_SECRET_ACCESS_KEY: ${{ secrets.RIVLOOM_R2_SECRET_ACCESS_KEY }}
        run: node scripts/r2-retention-once/execute.mjs execute
      - name: Preserve inventory and actual per-key results without credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rivloom-r2-retention-once-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/r2-retention-once/*.json
          if-no-files-found: error
          retention-days: 90
