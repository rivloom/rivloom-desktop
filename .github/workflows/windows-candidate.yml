name: Windows build and release

on:
  workflow_dispatch:
  push:
    tags: [ci-v*]
  workflow_run:
    workflows: [Windows CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-rivloom-candidate-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  RUSTUP_TOOLCHAIN: 1.98.1
  CI: 'true'
  RIVLOOM_CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  RIVLOOM_CANDIDATE_REF_TYPE: ${{ github.event_name == 'workflow_run' && 'branch' || github.ref_type }}
  RIVLOOM_CANDIDATE_REF_NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  candidate:
    name: Build and verify Rivloom candidate
    if: >-
      github.repository == 'rivloom/rivloom-desktop' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ci-v')) ||
       (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload_candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RIVLOOM_CANDIDATE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          architecture: x64
          package-manager-cache: false
      - name: Require all Windows CI checks for this exact source commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-candidate-gate.ts
      - name: Install fixed Rust toolchain and target
        run: rustup toolchain install 1.98.1 --profile minimal --target x86_64-pc-windows-msvc
      - run: npm.cmd ci
      - name: Verify candidate source, version and Rivloom identity
        run: node scripts/ci-candidate.ts configure
      - name: Run CI helper guards
        run: npm.cmd run ci:selftest
      - name: Cache the locked Windows Cargo sources for read-only license verification
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Prepare the desktop runtime once
        run: npm.cmd run desktop:prepare -- --profile desktop
      - name: Verify prepared runtime and notices before bundling
        run: |
          node scripts/ci-verify-runtime.ts --profile desktop > test-results/candidate/runtime-before.json
          if ($LASTEXITCODE -ne 0) { throw 'Pre-build runtime verification failed.' }
          node scripts/ci-candidate.ts capture-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Could not bind the verified runtime.' }
      - name: Run native unit tests before bundling
        env:
          TOKIO_WORKER_THREADS: '1'
        run: >-
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml
          --target x86_64-pc-windows-msvc
      - name: Verify LAN firewall rules with isolated Windows command mocks
        run: powershell -NoProfile -NonInteractive -File scripts/lan-firewall-check.ps1
      - name: Build NSIS without re-running preparation or signing
        run: >-
          node node_modules/@tauri-apps/cli/tauri.js build
          --config test-results/candidate/build-config.json
          --target x86_64-pc-windows-msvc --bundles nsis --ci --no-sign -- --locked
      - name: Verify runtime again after native build
        run: |
          node scripts/ci-verify-runtime.ts --profile desktop > test-results/candidate/runtime-after.json
          if ($LASTEXITCODE -ne 0) { throw 'Post-build runtime verification failed.' }
      - name: Record final candidate bytes and unchanged runtime
        run: node scripts/ci-candidate.ts record
      - name: Prepare WebView2 only on this disposable GitHub runner
        run: ./scripts/ci-webview2.ps1
      - name: Verify isolated Rivloom install, startup and uninstall
        run: ./scripts/ci-desktop-install-smoke.ps1 -ExpectedCommit $env:RIVLOOM_CANDIDATE_SHA
      - name: Upload only the candidate installer and bounded manifests
        id: upload_candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rivloom-candidate-${{ env.RIVLOOM_CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/candidate/*.exe
            test-results/candidate/candidate-build.json
            test-results/candidate/runtime-manifest.json
            test-results/candidate/runtime-before.json
            test-results/candidate/runtime-after.json
            test-results/candidate/ci-gate.json
            test-results/candidate/desktop-install.json
            test-results/candidate/webview2.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed gate results without publishing a candidate
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rivloom-candidate-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/candidate/runtime-*.json
            test-results/candidate/ci-gate.json
            test-results/candidate/desktop-install.json
            test-results/candidate/webview2.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish verified Rivloom to Releases
    needs: candidate
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      artifact-id: ${{ steps.upload_release.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RIVLOOM_CANDIDATE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          architecture: x64
          package-manager-cache: false
      - name: Download only this run's verified candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: test-results/candidate
          digest-mismatch: error
      - name: Validate evidence and publish the Rivloom release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RIVLOOM_CANDIDATE_ARTIFACT_ID: ${{ needs.candidate.outputs.artifact-id }}
        run: node scripts/ci-release.ts
      - name: Preserve the bounded release result
        id: upload_release
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rivloom-release-${{ env.RIVLOOM_CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/release/release.json
          if-no-files-found: warn
          retention-days: 14

  website-download:
    name: Publish the same Rivloom installer to the website
    if: vars.RIVLOOM_PUBLIC_DOWNLOADS_ENABLED == 'true'
    needs: [candidate, publish]
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    concurrency:
      group: public-rivloom-download
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RIVLOOM_CANDIDATE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          architecture: x64
          package-manager-cache: false
      - name: Download the exact installed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: test-results/candidate
          digest-mismatch: error
      - name: Download the successful publication record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.publish.outputs.artifact-id }}
          path: test-results/release
          digest-mismatch: error
      - name: Verify public download and update the website
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RIVLOOM_CANDIDATE_ARTIFACT_ID: ${{ needs.candidate.outputs.artifact-id }}
          RIVLOOM_R2_ACCOUNT_ID: ${{ vars.RIVLOOM_R2_ACCOUNT_ID }}
          RIVLOOM_R2_BUCKET: ${{ vars.RIVLOOM_R2_BUCKET }}
          RIVLOOM_R2_ACCESS_KEY_ID: ${{ secrets.RIVLOOM_R2_ACCESS_KEY_ID }}
          RIVLOOM_R2_SECRET_ACCESS_KEY: ${{ secrets.RIVLOOM_R2_SECRET_ACCESS_KEY }}
          RIVLOOM_PAGES_DEPLOY_HOOK: ${{ secrets.RIVLOOM_PAGES_DEPLOY_HOOK }}
        run: node scripts/ci-website-download.ts
      - name: Preserve the bounded website download result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rivloom-website-${{ env.RIVLOOM_CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/website-download/result.json
          if-no-files-found: warn
          retention-days: 14

  updater:
    name: Sign and publish the verified desktop update
    if: vars.RIVLOOM_UPDATES_ENABLED == 'true' && vars.RIVLOOM_PUBLIC_DOWNLOADS_ENABLED == 'true'
    needs: [candidate, publish, website-download]
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    concurrency:
      group: public-rivloom-download
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RIVLOOM_CANDIDATE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          architecture: x64
          package-manager-cache: false
      - name: Install the pinned official signing CLI before exposing secrets
        run: npm ci
      - name: Download the exact installed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: test-results/candidate
          digest-mismatch: error
      - name: Sign the existing installer and promote the verified update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RIVLOOM_UPDATES_ENABLED: 'true'
          RIVLOOM_CANDIDATE_ARTIFACT_ID: ${{ needs.candidate.outputs.artifact-id }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.RIVLOOM_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.RIVLOOM_UPDATER_PRIVATE_KEY_PASSWORD }}
          RIVLOOM_R2_ACCOUNT_ID: ${{ vars.RIVLOOM_R2_ACCOUNT_ID }}
          RIVLOOM_R2_BUCKET: ${{ vars.RIVLOOM_R2_BUCKET }}
          RIVLOOM_R2_ACCESS_KEY_ID: ${{ secrets.RIVLOOM_R2_ACCESS_KEY_ID }}
          RIVLOOM_R2_SECRET_ACCESS_KEY: ${{ secrets.RIVLOOM_R2_SECRET_ACCESS_KEY }}
        run: node scripts/ci-updater.ts
      - name: Preserve public update metadata and bounded result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rivloom-updater-${{ env.RIVLOOM_CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/updater/result.json
            test-results/updater/latest.json
          if-no-files-found: warn
          retention-days: 14
