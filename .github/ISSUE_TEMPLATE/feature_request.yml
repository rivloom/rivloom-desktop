name: Feature / 功能建议
description: 描述希望完成的任务及现有流程中的问题。
body:
  - type: textarea
    id: goal
    attributes:
      label: 希望解决什么问题
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望的行为与使用场景
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方法或限制
