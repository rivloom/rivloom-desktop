name: Bug / 问题报告
description: 提交可复现的问题，不包含敏感内容或漏洞细节。
body:
  - type: markdown
    attributes:
      value: 请先查看 SECURITY.md。不要提交账号、Key、真实会话、数据目录或未经脱敏的日志；安全漏洞请私下报告。
  - type: input
    id: version
    attributes:
      label: Rivloom 与 Windows 版本
      placeholder: Rivloom 0.1.14 / Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 使用合成内容描述最小复现。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的补充信息
      description: 可附错误摘要或截图，请勿附原始数据和完整日志。
